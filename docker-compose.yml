x-common: &common
  restart: unless-stopped
  networks:
    - hedge-net

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  ollama:
    <<: *common
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    container_name: hedge-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_FLASH_ATTENTION: "1"
    mem_limit: 4096m
    memswap_limit: 8192m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    <<: *common
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    container_name: hedge-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      # Versioned volume: never open an older collection in-place during an upgrade.
      - qdrant-v118-data:/qdrant/storage
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    <<: *common
    image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    container_name: hedge-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hedge}
      POSTGRES_USER: ${POSTGRES_USER:-hedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hedge-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/0001_initial.up.sql:/docker-entrypoint-initdb.d/0001_initial.sql:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  valkey-cache:
    <<: *common
    image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
    container_name: hedge-valkey-cache
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  valkey-queue:
    <<: *common
    image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
    container_name: hedge-valkey-queue
    volumes:
      - valkey-queue-data:/data
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  migrations:
    build:
      context: .
      dockerfile: services/metadata-ingest/Dockerfile
    container_name: hedge-migrations
    command: ["python", "/database/migrate.py"]
    restart: "no"
    networks:
      - hedge-net
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hedge}:${POSTGRES_PASSWORD:-hedge-dev-only}@postgres:5432/${POSTGRES_DB:-hedge}
    volumes:
      - ./database:/database:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 96m

  mock-api:
    <<: *common
    build:
      context: .
      dockerfile: services/mock-api/Dockerfile
    container_name: hedge-mock-api
    ports:
      - "127.0.0.1:9000:9000"
    env_file: .env
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  discovery-ranking:
    <<: *common
    build:
      context: .
      dockerfile: services/discovery-ranking/Dockerfile
    container_name: hedge-discovery-ranking
    ports:
      - "127.0.0.1:8003:8003"
    env_file: .env
    environment:
      # Release-2 retrieval contract: changing either value requires a reviewed
      # full reindex and a new versioned Compose revision.
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      EMBEDDING_MODEL_REVISION: 614241f622f53c4eeff9890bdc4f31cfecc418b3
      QDRANT_COLLECTION_VERSION: ${QDRANT_COLLECTION_VERSION:-v2}
      HF_HOME: /model-cache
      SENTENCE_TRANSFORMERS_HOME: /model-cache
    volumes:
      - embedding-model-cache:/model-cache
    depends_on:
      qdrant:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  metadata-ingest:
    <<: *common
    build:
      context: .
      dockerfile: services/metadata-ingest/Dockerfile
    container_name: hedge-metadata-ingest
    ports:
      - "127.0.0.1:8004:8004"
    env_file: .env
    depends_on:
      migrations:
        condition: service_completed_successfully
      valkey-queue:
        condition: service_healthy
      discovery-ranking:
        condition: service_healthy
      mock-api:
        condition: service_healthy
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  metadata-worker:
    <<: *common
    build:
      context: .
      dockerfile: services/metadata-ingest/Dockerfile
    container_name: hedge-metadata-worker
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    env_file: .env
    depends_on:
      migrations:
        condition: service_completed_successfully
      valkey-queue:
        condition: service_healthy
      discovery-ranking:
        condition: service_healthy
      mock-api:
        condition: service_healthy
    mem_limit: 256m

  metadata-scheduler:
    <<: *common
    build:
      context: .
      dockerfile: services/metadata-ingest/Dockerfile
    container_name: hedge-metadata-scheduler
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file: .env
    depends_on:
      valkey-queue:
        condition: service_healthy
    mem_limit: 128m

  expert-recommend:
    <<: *common
    build:
      context: .
      dockerfile: services/expert-recommend/Dockerfile
    container_name: hedge-expert-recommend
    ports:
      - "127.0.0.1:8002:8002"
    env_file: .env
    depends_on:
      ollama:
        condition: service_healthy
      discovery-ranking:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  chat-intent:
    <<: *common
    build:
      context: .
      dockerfile: services/chat-intent/Dockerfile
    container_name: hedge-chat-intent
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      # Override the one-release REDIS_URL compatibility alias so a stale
      # local .env cannot point session state at the removed Redis service.
      VALKEY_SESSION_URL: redis://valkey-cache:6379/0
    depends_on:
      valkey-cache:
        condition: service_healthy
      expert-recommend:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway:
    <<: *common
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: hedge-gateway
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:8080:8000"
    env_file: .env
    depends_on:
      chat-intent:
        condition: service_healthy
      mock-api:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Optional: RASA (disabled by default — too heavy for 5GB server)
  # Start with: docker compose --profile full up rasa
  # ---------------------------------------------------------------------------
  rasa:
    <<: *common
    build:
      context: .
      dockerfile: services/rasa/Dockerfile
    container_name: hedge-rasa
    ports:
      - "127.0.0.1:5005:5005"
    profiles:
      - full
      - rasa
    env_file: .env
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5005/status')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Optional: TLS edge proxy (public 80/443 entrypoint)
  # Start with: docker compose --profile tls up nginx
  # ---------------------------------------------------------------------------
  nginx:
    <<: *common
    build:
      context: .
      dockerfile: services/nginx/Dockerfile
    container_name: hedge-nginx
    profiles:
      - tls
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - nginx-certs:/etc/nginx/certs
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Optional: Keycloak auth stack
  # Start with: docker compose --profile auth up keycloak keycloak-db
  # ---------------------------------------------------------------------------
  keycloak-db:
    <<: *common
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: hedge-keycloak-db
    profiles:
      - auth
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:25.0@sha256:82c5b7a110456dbd42b86ea572e728878549954cc8bd03cd65410d75328095d2
    container_name: hedge-keycloak
    profiles:
      - auth
    command: ["start-dev", "--http-port=8080", "--proxy-headers=xforwarded", "--hostname-strict=false"]
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      keycloak-db:
        condition: service_healthy
    mem_limit: 1024m

networks:
  hedge-net:
    driver: bridge

volumes:
  ollama-data:
  qdrant-v118-data:
  embedding-model-cache:
  postgres-data:
  valkey-queue-data:
  nginx-certs:
  keycloak-db-data:
