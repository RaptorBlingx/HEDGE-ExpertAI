# The model intentionally uses language-independent word/character features.
# Dialogue policy remains in chat-intent; this service is NLU-only.
recipe: default.v1
assistant_id: hedge-expertai-nlu-v2
language: en

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 3
    max_ngram: 5
  - name: DIETClassifier
    epochs: 50
    constrain_similarities: true
    random_seed: 42
  - name: EntitySynonymMapper

policies: []
