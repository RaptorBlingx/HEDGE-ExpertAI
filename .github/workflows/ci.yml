name: HEDGE-ExpertAI CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
      - name: Install ruff
        run: pip install ruff==0.16.1
      - name: Lint
        run: ruff check shared/ services/ tests/ scripts/ evaluation/ database/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
      - name: Install dependencies
        run: |
          pip install --require-hashes \
            -r shared/requirements.lock \
            -r services/chat-intent/requirements.lock \
            -r services/discovery-ranking/requirements.lock \
            -r services/expert-recommend/requirements.lock \
            -r services/metadata-ingest/requirements.lock \
            -r services/gateway/requirements.lock \
            -r services/mock-api/requirements.lock
          pip install --no-deps -e shared/
          pip install pytest==8.4.1 pytest-cov==6.2.1 pytest-asyncio==1.1.0 pip-audit==2.9.0 pip-licenses==5.5.5
      - name: Audit installed Python dependencies
        run: |
          for lock in \
            shared/requirements.lock \
            services/chat-intent/requirements.lock \
            services/discovery-ranking/requirements.lock \
            services/expert-recommend/requirements.lock \
            services/metadata-ingest/requirements.lock \
            services/gateway/requirements.lock \
            services/mock-api/requirements.lock; do
            pip-audit --strict --requirement "$lock"
          done
      - name: Enforce backend dependency licence policy
        run: |
          pip-licenses --from=expression \
            --fail-on="GPL-3.0-only;AGPL-3.0-only;SSPL-1.0;BUSL-1.1" \
            --format=json --output-file=python-licenses.json
      - name: Run core unit tests with branch coverage
        run: |
          python -m pytest tests/unit/ -v \
            --cov=shared/hedge_shared --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80
      - name: Verify generated OpenAPI contracts are current
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi/
      - name: Validate catalogue and multilingual NLU assets
        run: |
          python scripts/generate_catalogue.py --check
          python scripts/generate_rasa_nlu.py --check
          python scripts/generate_evaluation_set.py --check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload backend licence inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-licences
          path: python-licenses.json

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build all images
        run: |
          cp .env.example .env
          docker compose build
      - name: Validate compose config
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet

  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test, audit, and build the frontend reproducibly
        working-directory: frontend
        run: |
          npm ci
          node ../scripts/check_npm_licenses.mjs node_modules --output npm-licenses.json
          npm test
          npm audit --audit-level=high
          npm run build
      - name: Upload frontend licence inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-licences
          path: frontend/npm-licenses.json

  e2e:
    runs-on: ubuntu-latest
    needs: [build, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start deterministic production-path stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build \
            postgres valkey-cache valkey-queue qdrant mock-api discovery-ranking \
            metadata-ingest metadata-worker metadata-scheduler expert-recommend \
            rasa chat-intent gateway
      - name: Verify ingestion, filtered retrieval, and grounded streaming
        run: ./scripts/e2e_smoke.sh
      - name: Capture container diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs \
            --no-color --tail=300
      - name: Stop deterministic stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --volumes

  supply-chain:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-banner --redact --exit-code=1
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: hedge-expertai.spdx.json
          artifact-name: hedge-expertai-sbom.spdx.json
          upload-release-assets: false
      - name: Scan source dependencies
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          output-format: table
