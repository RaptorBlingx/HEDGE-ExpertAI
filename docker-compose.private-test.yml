# Isolated VM test deployment. Never combine with the demo Compose files.
name: expertai-private-test
x-app: &app
  restart: unless-stopped
  networks:
  - private
  read_only: true
  cap_drop:
  - ALL
  security_opt:
  - no-new-privileges:true
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: '2'
  user: 1000:1000
  env_file:
  - ${PRIVATE_TEST_DIR:?}/runtime.env
  volumes:
  - .:/source:ro
  tmpfs:
  - /tmp:rw,size=64m,mode=1777
  cpus: 0.75
  entrypoint:
  - python
  - -m
  - uvicorn
services:
  postgres:
    restart: unless-stopped
    networks:
    - private
    read_only: false
    cap_drop: []
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 20
  valkey-cache:
    restart: unless-stopped
    networks:
    - private
    read_only: false
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
    volumes:
    - valkey-cache-data:/data
    command:
    - valkey-server
    - --appendonly
    - 'no'
    - --save
    - ''
    - --maxmemory
    - 64mb
    - --maxmemory-policy
    - allkeys-lru
    mem_limit: 96m
    cpus: 0.25
    user: 999:1000
  valkey-queue:
    restart: unless-stopped
    networks:
    - private
    read_only: false
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
    volumes:
    - valkey-queue-data:/data
    command:
    - valkey-server
    - --appendonly
    - 'yes'
    - --save
    - ''
    - --maxmemory
    - 64mb
    - --maxmemory-policy
    - noeviction
    mem_limit: 96m
    cpus: 0.25
    user: 999:1000
  qdrant:
    restart: unless-stopped
    networks:
    - private
    read_only: false
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    volumes:
    - qdrant-data:/qdrant/storage
    mem_limit: 192m
    cpus: 0.5
  rasa:
    restart: unless-stopped
    networks:
    - private
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    image: sha256:7acc517967ac546e78238eed6a63ab3704d6953ff701e0a12a0c641bb977f868
    user: 1001:1001
    tmpfs:
    - /tmp:rw,size=64m,mode=1777
    environment:
      RASA_TELEMETRY_ENABLED: 'false'
      OMP_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      SQLALCHEMY_SILENCE_UBER_WARNING: '1'
    mem_limit: 700m
    cpus: 0.75
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5005/status')
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  discovery-ranking:
    <<: *app
    image: sha256:e02493fccbbf67c15c6abf52e25695963795cb9f588f99b7e1fd75db475b41cb
    environment:
      PYTHONPATH: /source/shared:/source/services/discovery-ranking
      EMBEDDING_MODEL: /opt/e5-model
    mem_limit: 1024m
    command:
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8003'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8003/live')
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /source/services/discovery-ranking
  expert-recommend:
    <<: *app
    image: sha256:621886c6c365bc5c766c5a00f858637a5ce6ccba5c8f0a41bddf5fa886f1bfeb
    environment:
      PYTHONPATH: /source/shared:/source/services/expert-recommend
    mem_limit: 160m
    command:
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8002'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8002/live')
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      discovery-ranking:
        condition: service_healthy
    working_dir: /source/services/expert-recommend
  chat-intent:
    <<: *app
    image: sha256:48ff51481447f2d22aaf0fe5796e59264ef964c99fbadf51d3cce6011b13c7f7
    environment:
      PYTHONPATH: /source/shared:/source/services/chat-intent
    mem_limit: 192m
    command:
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8001'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8001/live')
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      expert-recommend:
        condition: service_healthy
      rasa:
        condition: service_healthy
    working_dir: /source/services/chat-intent
  metadata-ingest:
    <<: *app
    networks:
    - private
    - egress
    image: sha256:969121dc3871b0a1d3635da811367951776fd360f2c04f4a91f22e988fd60f0d
    environment:
      PYTHONPATH: /source/shared:/source/services/metadata-ingest
    volumes:
    - .:/source:ro
    - ${PRIVATE_TEST_DIR:?}/credentials:/credentials:ro
    mem_limit: 192m
    command:
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8004'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8004/live')
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      discovery-ranking:
        condition: service_healthy
    working_dir: /source/services/metadata-ingest
  metadata-worker:
    <<: *app
    networks:
    - private
    - egress
    image: sha256:969121dc3871b0a1d3635da811367951776fd360f2c04f4a91f22e988fd60f0d
    environment:
      PYTHONPATH: /source/shared:/source/services/metadata-ingest
    volumes:
    - .:/source:ro
    - ${PRIVATE_TEST_DIR:?}/credentials:/credentials:ro
    mem_limit: 256m
    entrypoint:
    - celery
    - -A
    - app.celery_app:celery_app
    command:
    - worker
    - --loglevel=warning
    - --concurrency=1
    depends_on:
      discovery-ranking:
        condition: service_healthy
    working_dir: /source/services/metadata-ingest
  metadata-scheduler:
    <<: *app
    image: sha256:969121dc3871b0a1d3635da811367951776fd360f2c04f4a91f22e988fd60f0d
    environment:
      PYTHONPATH: /source/shared:/source/services/metadata-ingest
    mem_limit: 128m
    entrypoint:
    - celery
    - -A
    - app.celery_app:celery_app
    command:
    - beat
    - --loglevel=warning
    - --schedule=/tmp/celerybeat-schedule
    depends_on:
      discovery-ranking:
        condition: service_healthy
    working_dir: /source/services/metadata-ingest
  gateway:
    <<: *app
    networks:
    - private
    - ingress
    image: sha256:71b3d0ed4da05e8e55c5f261a73d800e7ecf834ed3a9994a82de0552fdcfc0cb
    environment:
      PYTHONPATH: /source/shared:/source/services/gateway
    mem_limit: 192m
    command:
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/live')
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 60s
    ports:
    - 127.0.0.1:8096:8000
    depends_on:
      chat-intent:
        condition: service_healthy
    working_dir: /source/services/gateway
  migrations:
    <<: *app
    restart: 'no'
    image: sha256:969121dc3871b0a1d3635da811367951776fd360f2c04f4a91f22e988fd60f0d
    environment:
      PYTHONPATH: /source/shared
    tmpfs:
    - /tmp:rw,size=32m,mode=1777
    entrypoint:
    - python
    - /source/database/migrate.py
    command: []
    mem_limit: 96m
    depends_on:
      postgres:
        condition: service_healthy
networks:
  private:
    internal: true
  egress: {}
  ingress: {}
volumes:
  postgres-data: {}
  valkey-cache-data: {}
  valkey-queue-data: {}
  qdrant-data: {}
